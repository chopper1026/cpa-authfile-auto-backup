# CPA 认证文件自动备份配置

# CPA 项目列表
projects:
  - name: "cpa-main"                          # 项目名称，用于 OSS 路径区分
    auth_dir: "/data/cpa-main/auths"           # 服务器上认证文件目录的绝对路径
    config_file: "/data/cpa-main/config.yaml"  # 可选：同时备份 CPA 配置文件

  - name: "cpa-secondary"
    auth_dir: "/data/cpa-secondary/auths"
    config_file: "/data/cpa-secondary/config.yaml"

# 阿里云 OSS 配置
oss:
  endpoint: "oss-cn-hangzhou.aliyuncs.com"     # OSS Endpoint，根据实际区域修改
  access_key_id: "YOUR_ACCESS_KEY_ID"
  access_key_secret: "YOUR_ACCESS_KEY_SECRET"
  bucket_name: "your-bucket-name"
  backup_prefix: "cpa-backup"                  # OSS 上的目录前缀

# 定时规则
schedule:
  # interval 模式：每隔 N 小时备份一次
  type: "interval"
  interval_hours: 24

  # cron 模式示例（取消注释即可切换）：
  # type: "cron"
  # cron: "0 3 * * *"     # 每天凌晨 3 点执行

# 备份保留策略
retention:
  enabled: true
  keep_days: 30                               # 保留最近 30 天的备份

# 日志配置
logging:
  level: "INFO"                               # 日志级别：DEBUG, INFO, WARNING, ERROR
  file: "/var/log/cpa-backup/backup.log"      # 日志文件路径，留空则仅输出到控制台
